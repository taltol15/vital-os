# Live session identity. FLAVOUR must be non-empty or casper replaces
# USERNAME and HOST with the first word of .disk/info.
export USERNAME="vital"
export USERFULLNAME="Vital Live"
export HOST="vitalos"
# Casper only passes a quiet flag to modprobe when this is Ubuntu or Debian.
# Any other value becomes an empty argv entry and modprobe overlay fails,
# which drops the live session to an initramfs shell. The name shown to
# people is FLAVOUR and os-release, not this switch.
export BUILD_SYSTEM="Ubuntu"
export FLAVOUR="Vital OS"
