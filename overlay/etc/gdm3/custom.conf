# GDM configuration storage
#
# Casper's live autologin sed looks for the commented AutomaticLogin lines.
# Wayland is left at GDM's default so it is not forced off.

[daemon]
# Enabling automatic login
#  AutomaticLoginEnable = true
#  AutomaticLogin = user1

# Enabling timed login
#  TimedLoginEnable = true
#  TimedLogin = user1
#  TimedLoginDelay = 10

[security]

[xdmcp]

[chooser]

[debug]
#Enable=true
