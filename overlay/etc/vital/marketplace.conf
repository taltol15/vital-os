# Vital Marketplace client.
# Canonical API: https://vital-os.org/api/v1
# catalog_url is the signed catalog document. If it is empty, the public key
# is still the placeholder, or the server cannot be reached, the app uses the
# unsigned sample shipped in the image and says so.
catalog_url=https://vital-os.org/api/v1/catalog
public_key=/etc/vital/marketplace.pub
bundled_catalog=/usr/share/vitalos/marketplace/catalog.json
