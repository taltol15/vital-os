---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false
geoip:
    style: "none"
requirements:
    # Decimals are required. Calamares 3.3.5 accepts only a Double or a
    # LongLong for these keys. A YAML integer is ignored and the check
    # silently becomes 3 GiB of disk and 1 GiB of RAM, so a small VM disk
    # reaches unpackfs and rsync exits 11.
    requiredStorage: 16.0
    requiredRam: 2.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
