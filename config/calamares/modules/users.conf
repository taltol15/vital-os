---
defaultGroups:
    - name: sudo
      must_exist: true
      system: true
    - name: adm
      must_exist: true
      system: true
    - cdrom
    - dip
    - plugdev
    - lpadmin
    - audio
    - video
    - netdev
sudoersGroup: sudo
setRootPassword: false
doAutologin: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true
passwordRequirements:
    minLength: 1
    maxLength: -1
user:
    shell: /bin/bash
    forbidden_names: [ root ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "vitalos"
    forbidden_names: [ localhost ]
