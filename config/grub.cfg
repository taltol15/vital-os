set timeout=8
set default=0

insmod all_video
insmod gfxterm
insmod png
insmod jpeg
insmod iso9660
insmod part_gpt
insmod part_msdos

search --file --set=root /casper/vmlinuz
set prefix=($root)/boot/grub

if loadfont $prefix/fonts/inter.pf2; then
    set gfxmode=auto
    terminal_output gfxterm
fi

set theme=$prefix/themes/vital/theme.txt
export theme
set timeout=8
set timeout_style=menu

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Try Vital OS" {
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}

menuentry "Install Vital OS" {
    linux /casper/vmlinuz boot=casper quiet splash vitalos.installer ---
    initrd /casper/initrd
}

menuentry "Try Vital OS (safe graphics)" {
    linux /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd /casper/initrd
}
