# Vital Assistant. Keys are not stored in this file.
# provider is grok, openai, ollama, local, auto, or mock.
provider=grok
model=
base_url=
# Suggest a fix after a failed command. Off until you set this to 1.
shell_hook=0
# Include the working directory, last command, exit code, and distro. Off by default.
send_context=0
# Overlay shortcut. The GNOME extension reads the same value from its schema.
hotkey=<Super>space
language=system
actions_enabled=1
offer_files=0
offer_window=0
offer_clipboard=0
offer_screenshot=0
history_enabled=1
# auto uses a GPU llama.cpp build only when one is installed and a render node exists.
local_device=auto
